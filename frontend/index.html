<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP Customer Complaint Analyzer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>NLP Customer Complaint Analyzer</h1>
            <p class="subtitle">Analyze customer complaints using Natural Language Processing and an LLM.</p>
        </header>

        <main>
            <section class="input-section">
                <label for="complaint-input">Enter Customer Complaint:</label>
                <textarea id="complaint-input" placeholder="e.g., My order was supposed to arrive five days ago and I still haven't received it. Customer support is also not responding."></textarea>
                <button id="analyze-btn">Analyze Complaint</button>
                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <p>Analyzing complaint... Please wait.</p>
                </div>
                <div id="error-message" class="hidden error"></div>
            </section>

            <section id="results-section" class="results-section hidden">
                <h2>Analysis Results</h2>
                
                <div class="cards-grid">
                    <div class="card">
                        <h3>Sentiment</h3>
                        <p id="res-sentiment" class="tag">-</p>
                    </div>
                    
                    <div class="card">
                        <h3>Intent</h3>
                        <p id="res-intent" class="tag">-</p>
                    </div>

                    <div class="card">
                        <h3>Priority</h3>
                        <p id="res-priority" class="tag">-</p>
                    </div>
                </div>

                <div class="card full-width">
                    <h3>Keywords</h3>
                    <div id="res-keywords" class="keywords-container"></div>
                </div>

                <div class="card full-width">
                    <h3>Summary</h3>
                    <p id="res-summary">-</p>
                </div>

                <div class="card full-width">
                    <h3>Suggested Response</h3>
                    <p id="res-response">-</p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
